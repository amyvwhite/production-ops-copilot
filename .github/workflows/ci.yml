name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests (no AI key: the Gemini layer is tested with a scripted fake, so CI costs nothing)
        run: pytest -v --cov --cov-report=term
      - name: Sample data is reproducible
        run: python scripts/make_sample_data.py && git diff --exit-code sample_data/

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t production-ops-copilot .
